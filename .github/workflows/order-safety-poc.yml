name: Order safety PoC
on:
  pull_request:
  push:
    branches: ['codex/system-poc-v027-integration-20261028']
permissions:
  contents: read
jobs:
  mock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline mock tests
        working-directory: poc/order-safety
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
